[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wiki-rag"
version = "0.1.0"
description = "Durable, incremental Git documentation ingestion for OpenAI Retrieval"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["httpx==0.28.1"]

[project.scripts]
wiki-rag = "wiki_rag.cli:main"

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
