# Manual-first consumer template; replace example identifiers and source branch.
# Add a default-branch push trigger only after accepting plan/sync/no-op/MCP checks.
name: Update project knowledge
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview or publish the configured workspace
        type: choice
        required: true
        default: plan
        options: [plan, sync]
permissions:
  contents: read
jobs:
  rag:
    uses: rotnov/wiki4llm/.github/workflows/ingest.yml@main
    with:
      mode: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'sync' }}
      workspace: team-docs
      project-id: ${{ vars.WIKI_RAG_PROJECT_ID }}
      gate-origin: ${{ vars.WIKI_RAG_GATE_ORIGIN }}
      max-files: 1000
      collections: |
        [{"name":"docs","repository":"example/project","branch":"main",
          "vector_store_id":"vs_example","include":["docs/**/*.md"],
          "exclude":[],"extensions":[".md"]}]
    secrets:
      gate-client-id: ${{ secrets.RAG_CLIENT_ID }}
      gate-token: ${{ secrets.RAG_TOKEN }}
      openai-key: ${{ secrets.OPENAI_RAG_KEY }}
      # Optional. Omit for the caller's repository and accessible public sources.
      github-token: ${{ secrets.RAG_GITHUB_TOKEN }}
