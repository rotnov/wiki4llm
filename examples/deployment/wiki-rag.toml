version = 1
max_files = 200

[remote_state]
origin_env = "WIKI_RAG_GATE_ORIGIN"
workspace = "team-docs"
client_id_env = "WIKI_RAG_ACCESS_CLIENT_ID"
client_secret_env = "WIKI_RAG_ACCESS_CLIENT_SECRET"
lease_wait_seconds = 300

[openai]
project_id = "proj_example"
api_key_env = "WIKI_RAG_INGEST_KEY"

[[collections]]
name = "guide"
repository = "example/guide"
root = "./source"
branch = "main"
vector_store_id = "vs_example"
include = ["README.md", "docs/**/*.md"]
exclude = ["docs/private/**", "**/local-evidence/**"]
extensions = [".md"]
