name: Reusable wiki ingestion

on:
  workflow_call:
    inputs:
      config:
        type: string
        default: wiki-rag.toml
        description: Committed TOML path relative to the configuration repository
      gate-origin:
        type: string
        required: true
      mode:
        type: string
        default: sync
        description: sync publishes incrementally; plan makes no provider writes
      lease-wait-seconds:
        type: number
        default: 300
      config-repository:
        type: string
        default: ""
        description: Defaults to the caller repository
      config-ref:
        type: string
        default: ""
        description: Defaults to the triggering SHA; required for another config repository
      tool-repository:
        type: string
        default: rotnov/wiki4llm
      tool-ref:
        type: string
        required: true
        description: Full reviewed commit SHA; pin to the same revision as this workflow
      environment:
        type: string
        default: wiki-rag-publisher
    secrets:
      gate-client-id:
        required: true
      gate-token:
        required: true
        description: Cloudflare Access service-token secret for the publisher
      openai-key:
        required: false
        description: Required for sync; unused for plan
      github-token:
        required: false
        description: Optional contents-read token for other private repositories
    outputs:
      workspace:
        value: ${{ jobs.ingest.outputs.workspace }}
      publication-id:
        value: ${{ jobs.ingest.outputs.publication-id }}

permissions:
  contents: read

jobs:
  ingest:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: wiki-rag-${{ inputs.config-repository || github.repository }}-${{ inputs.config }}
      cancel-in-progress: false
    outputs:
      workspace: ${{ steps.ingest.outputs.workspace }}
      publication-id: ${{ steps.ingest.outputs.publication-id }}
    steps:
      - name: Validate workflow inputs
        env:
          TOOL_REF: ${{ inputs.tool-ref }}
          MODE: ${{ inputs.mode }}
          CONFIG_PATH: ${{ inputs.config }}
          CONFIG_REPOSITORY: ${{ inputs.config-repository }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CONFIG_REF: ${{ inputs.config-ref }}
          LEASE_WAIT: ${{ inputs.lease-wait-seconds }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          def require(value, message):
              if not value:
                  raise SystemExit(message)
          require(re.fullmatch(r"[0-9a-f]{40}", os.environ["TOOL_REF"]), "tool-ref must be a full commit SHA")
          require(os.environ["MODE"] in {"plan", "sync"}, "mode must be plan or sync")
          path = pathlib.PurePosixPath(os.environ["CONFIG_PATH"])
          require(not path.is_absolute() and ".." not in path.parts and "\\" not in str(path), "config must stay inside its repository")
          external = os.environ["CONFIG_REPOSITORY"] not in {"", os.environ["CALLER_REPOSITORY"]}
          require(not external or os.environ["CONFIG_REF"], "external config repository requires config-ref")
          wait = os.environ["LEASE_WAIT"]
          require(wait.isdecimal() and 0 <= int(wait) <= 1800, "lease wait must be an integer from 0 to 1800")
          PY
      - name: Checkout reviewed tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.tool-repository }}
          ref: ${{ inputs.tool-ref }}
          path: .wiki-rag-tool
          fetch-depth: 0
          submodules: false
          persist-credentials: false
          token: ${{ secrets.github-token || github.token }}
      - name: Checkout committed configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.config-repository || github.repository }}
          ref: ${{ inputs.config-ref || github.sha }}
          path: .wiki-rag-config
          fetch-depth: 0
          submodules: false
          persist-credentials: false
          token: ${{ secrets.github-token || github.token }}
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Synchronize workspace
        id: ingest
        env:
          CONFIG_PATH: .wiki-rag-config/${{ inputs.config }}
          MODE: ${{ inputs.mode }}
          LEASE_WAIT: ${{ inputs.lease-wait-seconds }}
          WIKI_RAG_GATE_ORIGIN: ${{ inputs.gate-origin }}
          WIKI_RAG_ACCESS_CLIENT_ID: ${{ secrets.gate-client-id }}
          WIKI_RAG_ACCESS_CLIENT_SECRET: ${{ secrets.gate-token }}
          WIKI_RAG_INGEST_KEY: ${{ secrets.openai-key }}
          WIKI_RAG_CHECKOUT_TOKEN: ${{ secrets.github-token || github.token }}
        run: |
          uv run --project "$GITHUB_WORKSPACE/.wiki-rag-tool" --frozen \
            python -m wiki_rag.github_actions --config "$CONFIG_PATH" \
            --mode "$MODE" --lease-wait-seconds "$LEASE_WAIT"
