name: Reusable wiki ingestion

on:
  workflow_call:
    inputs:
      config:
        type: string
        default: ""
        description: Optional committed TOML path; omit when passing workspace parameters
      workspace:
        type: string
        default: ""
        description: Workspace slug; selects direct workflow configuration
      project-id:
        type: string
        default: ""
        description: OpenAI project identifier
      collections:
        type: string
        default: ""
        description: JSON array of collections (name, repository, branch, vector_store_id, include, exclude, extensions)
      max-files:
        type: number
        default: 10000
      max-file-bytes:
        type: number
        default: 2000000
      max-total-bytes:
        type: number
        default: 50000000
      chunk-size:
        type: number
        default: 800
      chunk-overlap:
        type: number
        default: 400
      gate-origin:
        type: string
        required: true
      mode:
        type: string
        default: sync
        description: sync publishes incrementally; plan makes no provider writes
      lease-wait-seconds:
        type: number
        default: 300
      config-repository:
        type: string
        default: ""
        description: Defaults to the caller repository
      config-ref:
        type: string
        default: ""
        description: Defaults to the triggering SHA; required for another config repository
      tool-repository:
        type: string
        default: rotnov/wiki4llm
      tool-ref:
        type: string
        default: main
        description: Follow main by default, or supply a full commit SHA for a fixed version
      environment:
        type: string
        default: wiki-rag-publisher
    secrets:
      gate-client-id:
        required: true
      gate-token:
        required: true
        description: Cloudflare Access service-token secret for the publisher
      openai-key:
        required: false
        description: Required for sync; unused for plan
      github-token:
        required: false
        description: Optional contents-read token for other private repositories
    outputs:
      workspace:
        value: ${{ jobs.ingest.outputs.workspace }}
      publication-id:
        value: ${{ jobs.ingest.outputs.publication-id }}

permissions:
  contents: read

jobs:
  ingest:
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')) ||
      (github.event_name == 'push' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: wiki-rag-${{ inputs.config-repository || github.repository }}-${{ inputs.workspace || inputs.config || 'wiki-rag.toml' }}
      cancel-in-progress: false
    outputs:
      workspace: ${{ steps.ingest.outputs.workspace }}
      publication-id: ${{ steps.ingest.outputs.publication-id }}
    steps:
      - name: Validate workflow inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOOL_REF: ${{ inputs.tool-ref }}
          MODE: ${{ inputs.mode }}
          CONFIG_PATH: ${{ inputs.config || 'wiki-rag.toml' }}
          CONFIG_REPOSITORY: ${{ inputs.config-repository }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CONFIG_REF: ${{ inputs.config-ref }}
          LEASE_WAIT: ${{ inputs.lease-wait-seconds }}
          WIKI_RAG_WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          def require(value, message):
              if not value:
                  raise SystemExit(message)
          require(os.environ["TOOL_REF"] == "main" or re.fullmatch(r"[0-9a-f]{40}", os.environ["TOOL_REF"]), "tool-ref must be main or a full commit SHA")
          event, ref = os.environ["EVENT_NAME"], os.environ["RUN_REF"]
          require((event == "workflow_dispatch" and ref.startswith("refs/heads/")) or
                  (event == "push" and ref == "refs/heads/" + os.environ["DEFAULT_BRANCH"]),
                  "only manual branch dispatch or default-branch pushes may ingest")
          inputs = json.loads(os.environ["WIKI_RAG_WORKFLOW_INPUTS"])
          direct = any(inputs.get(k) for k in ("workspace", "project-id", "collections"))
          require(not direct or all(inputs.get(k) for k in ("workspace", "project-id", "collections")), "workspace, project-id and collections are required together")
          require(not direct or not any(inputs.get(k) for k in ("config", "config-repository", "config-ref")), "choose workflow parameters or committed config, not both")
          require(os.environ["MODE"] in {"plan", "sync"}, "mode must be plan or sync")
          path = pathlib.PurePosixPath(os.environ["CONFIG_PATH"])
          require(not path.is_absolute() and ".." not in path.parts and "\\" not in str(path), "config must stay inside its repository")
          external = os.environ["CONFIG_REPOSITORY"] not in {"", os.environ["CALLER_REPOSITORY"]}
          require(not external or os.environ["CONFIG_REF"], "external config repository requires config-ref")
          wait = os.environ["LEASE_WAIT"]
          require(wait.isdecimal() and 0 <= int(wait) <= 1800, "lease wait must be an integer from 0 to 1800")
          PY
      - name: Checkout ingestion tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.tool-repository }}
          ref: ${{ inputs.tool-ref }}
          path: .wiki-rag-tool
          fetch-depth: 0
          submodules: false
          persist-credentials: false
          token: ${{ secrets.github-token || github.token }}
      - name: Record resolved tool revision
        run: git -C .wiki-rag-tool rev-parse HEAD
      - name: Checkout committed configuration
        if: inputs.workspace == '' && inputs.project-id == '' && inputs.collections == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.config-repository || github.repository }}
          ref: ${{ inputs.config-ref || github.sha }}
          path: .wiki-rag-config
          fetch-depth: 0
          submodules: false
          persist-credentials: false
          token: ${{ secrets.github-token || github.token }}
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Synchronize workspace
        id: ingest
        env:
          CONFIG_PATH: .wiki-rag-config/${{ inputs.config || 'wiki-rag.toml' }}
          DIRECT_INPUTS: ${{ inputs.workspace != '' || inputs.project-id != '' || inputs.collections != '' }}
          WIKI_RAG_WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          MODE: ${{ inputs.mode }}
          LEASE_WAIT: ${{ inputs.lease-wait-seconds }}
          WIKI_RAG_GATE_ORIGIN: ${{ inputs.gate-origin }}
          WIKI_RAG_ACCESS_CLIENT_ID: ${{ secrets.gate-client-id }}
          WIKI_RAG_ACCESS_CLIENT_SECRET: ${{ secrets.gate-token }}
          WIKI_RAG_INGEST_KEY: ${{ secrets.openai-key }}
          WIKI_RAG_CHECKOUT_TOKEN: ${{ secrets.github-token || github.token }}
        run: |
          if [ "$DIRECT_INPUTS" = "true" ]; then
            config_args=(--workflow-inputs)
          else
            config_args=(--config "$CONFIG_PATH")
          fi
          uv run --project "$GITHUB_WORKSPACE/.wiki-rag-tool" --frozen \
            python -m wiki_rag.github_actions "${config_args[@]}" \
            --mode "$MODE" --lease-wait-seconds "$LEASE_WAIT"
